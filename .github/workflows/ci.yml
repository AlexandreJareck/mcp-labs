name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Embedding model for search_context (ADR-0014): public Hugging Face download,
      # cached between runs; the relevance tests must not be skipped in CI.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mcp-labs/sqlite-consulta/models
          key: embedding-model-paraphrase-multilingual-MiniLM-L12-v2-${{ hashFiles('uv.lock') }}
      - run: uv run sqlite-consulta download-model
      # ADR-0002: 80% per server. With a second server, measure each package separately.
      - run: uv run pytest --cov=sqlite_consulta --cov-report=term-missing --cov-fail-under=80
        env:
          SQLITE_CONSULTA_REQUIRE_MODEL: "1"
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
